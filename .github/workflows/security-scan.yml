name: ShieldFlow Security Pipeline

on:
  push:
  pull_request:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------
      # 1. Checkout repo (FULL HISTORY IMPORTANT FOR GITLEAKS)
      # ----------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------
      # 2. Debug: show files in runner
      # ----------------------------------------------------
      - name: Show repo files
        run: |
          echo "📂 Repository contents:"
          ls -R

      # ----------------------------------------------------
      # 3. Setup Python (for Semgrep)
      # ----------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ----------------------------------------------------
      # 4. Install Semgrep
      # ----------------------------------------------------
      - name: Install Semgrep
        run: pip install semgrep

      # ----------------------------------------------------
      # 5. Run Semgrep (SAST)
      # ----------------------------------------------------
      - name: Run Semgrep scan
        run: |
          semgrep --config auto . --json > semgrep.json

      - name: Upload Semgrep artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json

      # ----------------------------------------------------
      # 6. Install Gitleaks
      # ----------------------------------------------------
      - name: Install Gitleaks
        run: |
          set -e

          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz

          chmod +x gitleaks || chmod +x gitleaks*

          ./gitleaks version

      # ----------------------------------------------------
      # 7. Run Gitleaks (FORCE DETECTION + DEBUG)
      # ----------------------------------------------------
      - name: Run Gitleaks scan
        run: |
          ./gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks.json \
            --verbose || true

      # ----------------------------------------------------
      # 8. Show outputs (DEBUG)
      # ----------------------------------------------------
      - name: Show Semgrep output
        run: cat semgrep.json

      - name: Show Gitleaks output
        run: |
          echo "🔐 Gitleaks Results:"
          cat gitleaks.json || echo "No gitleaks output found"

      # ----------------------------------------------------
      # 9. Upload artifacts
      # ----------------------------------------------------
      - name: Upload Gitleaks artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json