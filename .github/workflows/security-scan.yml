name: ShieldFlow Security Pipeline

on:
  push:
  pull_request:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------
      # 1. Checkout repo
      # ----------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------
      # 2. Setup Python
      # ----------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ----------------------------------------------------
      # 3. Install tools
      # ----------------------------------------------------
      - name: Install dependencies
        run: |
          pip install semgrep jq

      # ----------------------------------------------------
      # 4. Run Semgrep
      # ----------------------------------------------------
      - name: Run Semgrep scan
        run: semgrep --config auto . --json > semgrep.json || true

      # ----------------------------------------------------
      # 5. Run Gitleaks
      # ----------------------------------------------------
      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
          chmod +x gitleaks

      - name: Run Gitleaks scan
        run: |
          ./gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks.json || true

      # ----------------------------------------------------
      # 6. Run Trivy
      # ----------------------------------------------------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -

          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy scan
        run: trivy fs . --format json --output trivy.json

      # ----------------------------------------------------
      # 7. Normalize + Send to ShieldFlow API
      # ----------------------------------------------------
      - name: Send findings to ShieldFlow
        run: |
          python - << 'EOF'
          import json
          import requests

          # ---------------- Semgrep ----------------
          try:
              semgrep = json.load(open("semgrep.json")).get("results", [])
          except:
              semgrep = []

          # ---------------- Gitleaks ----------------
          try:
              gitleaks = json.load(open("gitleaks.json"))
          except:
              gitleaks = []

          # ---------------- Trivy ----------------
          try:
              trivy = json.load(open("trivy.json")).get("Results", [])
          except:
              trivy = []

          payload = {
              "findings": []
          }

          # You can later improve mapping, for now we pass raw normalized lists
          payload["findings"] = (
              [{"tool": "semgrep", **x} for x in semgrep] +
              [{"tool": "gitleaks", **x} for x in gitleaks] +
              [{"tool": "trivy", **x} for x in trivy]
          )

          # IMPORTANT: change this to your ngrok / deployed URL
          API_URL = "https://ebd5-2406-7400-94-674a-d473-66ec-4a80-8296.ngrok-free.app/ingest/ci"

          r = requests.post(API_URL, json=payload)
          print(r.status_code)
          print(r.text)
          EOF
