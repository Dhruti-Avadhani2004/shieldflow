name: ShieldFlow Security Pipeline

on:
  push:
  pull_request:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------
      # 1. Checkout repo
      # ----------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
            fetch-depth: 0

      #---------------------------------------------------------
      # 2.5 debug notice
      - name: Show repo files
        run: ls -R
      #---------------------------------------------------------

      # ----------------------------------------------------
      # 2. Setup Python
      # ----------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ----------------------------------------------------
      # 3. Install Semgrep
      # ----------------------------------------------------
      - name: Install Semgrep
        run: pip install semgrep

      # ----------------------------------------------------
      # 4. Run Semgrep
      # ----------------------------------------------------
      - name: Run Semgrep scan
        run: semgrep --config auto . --json > semgrep.json

      - name: Upload Semgrep artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json

      # ----------------------------------------------------
      # 5. Install Gitleaks (ROBUST METHOD)
      # ----------------------------------------------------
      - name: Install Gitleaks
        run: |
          set -e

          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz

          # handle extracted filename variations
          if [ -f gitleaks ]; then
            chmod +x gitleaks
          else
            chmod +x gitleaks-linux-x64 || chmod +x gitleaks*
            mv gitleaks* gitleaks
            chmod +x gitleaks
          fi

          ./gitleaks version

      # ----------------------------------------------------
      # 6. Run Gitleaks
      # ----------------------------------------------------
      - name: Run Gitleaks scan
        run: |
          ./gitleaks detect --source . --report-format json --report-path gitleaks.json || true

      - name: Upload Gitleaks artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json

      # ----------------------------------------------------
      # 7. Debug output
      # ----------------------------------------------------
      - name: Show Semgrep output
        run: cat semgrep.json

      - name: Show Gitleaks output
        run: cat gitleaks.json || echo "no gitleaks output"

      # ----------------------------------------------------
      # 8. Future ingestion hooks
      # ----------------------------------------------------
      # - name: Send Semgrep results
      #   run: curl -X POST "https://YOUR_NGROK_URL/ingest/semgrep"

      # - name: Send Gitleaks results
      #   run: curl -X POST "https://YOUR_NGROK_URL/ingest/gitleaks"